name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 完整历史，用于计算 commit 数

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Calculate version
      id: version
      run: |
        # 计算 commit 总数作为 versionCode
        COMMIT_COUNT=$(git rev-list --count HEAD)
        echo "versionCode=$COMMIT_COUNT" >> $GITHUB_OUTPUT

        # 如果有 tag，用 tag 作为 versionName；否则用 0.0.commitCount
        TAG=$(git describe --tags --exact-match 2>/dev/null || echo "")
        if [ -n "$TAG" ]; then
          VERSION_NAME="${TAG#v}"  # 去掉 v 前缀
        else
          VERSION_NAME="0.0.$COMMIT_COUNT"
        fi
        echo "versionName=$VERSION_NAME" >> $GITHUB_OUTPUT

        echo "versionCode: $COMMIT_COUNT"
        echo "versionName: $VERSION_NAME"

    - name: Update version in build.gradle
      run: |
        cd FMPlayer/app
        sed -i "s/versionCode [0-9]*/versionCode ${{ steps.version.outputs.versionCode }}/" build.gradle
        sed -i "s/versionName \".*\"/versionName \"${{ steps.version.outputs.versionName }}\"/" build.gradle
        echo "Updated build.gradle:"
        grep -A2 "versionCode\|versionName" build.gradle

    - name: Grant execute permission for gradlew
      run: chmod +x FMPlayer/gradlew

    - name: Build debug APK
      run: |
        cd FMPlayer
        ./gradlew assembleDebug --stacktrace

    - name: Rename APK
      run: |
        cd FMPlayer/app/build/outputs/apk/debug
        mv app-debug.apk FMPlayer-v${{ steps.version.outputs.versionName }}.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FMPlayer-v${{ steps.version.outputs.versionName }}
        path: FMPlayer/app/build/outputs/apk/debug/FMPlayer-v${{ steps.version.outputs.versionName }}.apk
        retention-days: 30
